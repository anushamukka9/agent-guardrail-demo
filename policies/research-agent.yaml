# Research agent policy: a web-summarizing agent with a prompt-injection guardrail.
#
# The agent may fetch pages and read files freely. Writing notes changes
# persistent state, so it needs a human to approve; sending email leaves the
# sandbox entirely, so it is the most sensitive state-changing action the
# agent has. Two kinds of hard deny rules sit above the approval rules:
#
#   1. no-instructions-from-tool-output / no-email-from-tool-output: a
#      state-changing action whose instruction came from tool output
#      (rather than the user) is the textbook shape of a prompt-injection
#      attack. Deny it outright.
#   2. no-secrets-in-notes / no-secrets-in-email: notes and email bodies
#      must never contain credentials, no matter who asked. Defense in
#      depth in case rule 1 ever misses.
#
# The {agent} placeholder keeps the policy reusable across agent instances.

name: research-agent-policy
version: 1
description: Web-summarizing agent. Reads freely, writes need approval, injected instructions are denied.
default: deny

rules:
  - name: fetch-pages
    description: Fetching a page is read-only and always allowed.
    decision: allow
    match:
      tool: http.fetch

  - name: read-sandbox-files
    description: Reading files inside the sandbox is read-only and allowed.
    decision: allow
    match:
      tool: file.read

  - name: no-instructions-from-tool-output
    description: Never obey instructions that arrived inside tool output.
    decision: deny
    match:
      tool: notes.write
      args.instruction_source: tool-output

  - name: no-secrets-in-notes
    description: Notes must never hold credentials, whoever asked for the write.
    decision: deny
    match:
      tool: notes.write
      args.content: "regex:(?is).*\\b(password|passwd|api[_-]?key|secret)\\b.*|.*\\bcredentials\\b\\s*[:=].*"

  - name: notes-need-approval
    description: Writing notes changes persistent state, so a human approves.
    decision: approve
    match:
      tool: notes.write

  - name: no-email-from-tool-output
    description: Never send email on instructions that arrived inside tool output.
    decision: deny
    match:
      tool: email.send
      args.instruction_source: tool-output

  - name: no-secrets-in-email
    description: Email bodies must never hold credentials, whoever asked for the send.
    decision: deny
    match:
      tool: email.send
      args.body: "regex:(?is).*\\b(password|passwd|api[_-]?key|secret)\\b.*|.*\\bcredentials\\b\\s*[:=].*"

  - name: email-needs-approval
    description: Sending email leaves the sandbox, so a human approves every send.
    decision: approve
    match:
      tool: email.send
