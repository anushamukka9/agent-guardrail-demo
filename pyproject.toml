[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-guardrail-demo"
version = "0.1.0"
description = "A thin research agent protected by agent-policy-kit: watch it do a benign task, then watch it get attacked through a tool response and blocked by the guardrail. Deterministic, no model calls."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anusha Mukka" }]
keywords = ["ai-agents", "prompt-injection", "guardrails", "policy-as-code", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "agent-policy-kit @ git+https://github.com/anushamukka9/agent-policy-kit.git",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff>=0.4"]

[project.scripts]
guardrail-demo = "guardrail_demo.demo:main"

[project.urls]
Homepage = "https://github.com/anushamukka9/agent-guardrail-demo"
Issues = "https://github.com/anushamukka9/agent-guardrail-demo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_demo"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
